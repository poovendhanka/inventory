<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sales Report - Coconut Husk Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="/raw-materials">Raw Materials</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/production">Production</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/sales">Sales</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/accounts">Accounts</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1>Sales Report</h1>
                </div>

                <!-- Report Filter -->
                <form th:action="@{/sales/report}" method="get" class="mb-4">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="form-label">Start Date</label>
                            <input type="datetime-local" class="form-control" name="startDate" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">End Date</label>
                            <input type="datetime-local" class="form-control" name="endDate" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">&nbsp;</label>
                            <button type="submit" class="btn btn-primary d-block">Generate Report</button>
                        </div>
                    </div>
                </form>

                <!-- Sales Report Table -->
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Invoice Number</th>
                                <th>Date</th>
                                <th>Dealer</th>
                                <th>Product</th>
                                <th>Quantity (kg)</th>
                                <th>Price/Unit</th>
                                <th>Total Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sale : ${sales}">
                                <td th:text="${sale.invoiceNumber}"></td>
                                <td th:text="${#temporals.format(sale.saleDate, 'dd-MM-yyyy HH:mm')}"></td>
                                <td th:text="${sale.dealer.name}"></td>
                                <td th:text="${sale.productType.displayName}"></td>
                                <td th:text="${sale.quantity}"></td>
                                <td th:text="${sale.pricePerUnit}"></td>
                                <td th:text="${sale.totalAmount}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="6" class="text-end"><strong>Total:</strong></td>
                                <td><strong th:text="${#aggregates.sum(sales.![totalAmount])}">0.00</strong></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
